
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Traffic Signal</title>

    <link rel="stylesheet" href="css.css">
</head>
<body>

    <div class="container">

        <h1>TRAFFIC SIGNAL</h1>
        <p class="subtitle">Smart Traffic Light Simulator</p>

        <div class="traffic-light">

            <div class="light red" id="red"></div>

            <div class="light yellow" id="yellow"></div>

            <div class="light green" id="green"></div>

        </div>

        <h2 id="status">SYSTEM READY</h2>

        <button id="change">
            CHANGE SIGNAL
        </button>

        <p class="footer">HTML • CSS • JAVASCRIPT</p>

    </div>

    <script src="js.js"></script>

</body>
</html>
